version: '3.8'

services:
  neo4j:
    image: neo4j:latest
    container_name: blockchain-forensics-neo4j
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    environment:
      - NEO4J_AUTH=neo4j/forensics123
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
      - ./database/neo4j:/import
    restart: unless-stopped

volumes:
  neo4j_data:
    driver: local
